name: caja-link

x-caja: &caja
  build: ./mocks
  env_file: .env
  volumes:
    - ./mocks/data:/data:ro

services:
  caja-norte:
    <<: *caja
    environment:
      CAJA: norte
      PORT: "9001"
    ports:
      - "${CAJA_NORTE_PORT:-9001}:9001"

  caja-oriente:
    <<: *caja
    environment:
      CAJA: oriente
      PORT: "9002"
    ports:
      - "${CAJA_ORIENTE_PORT:-9002}:9002"

  # Cuarta caja: docker compose --profile caja-sur up -d
  caja-sur:
    <<: *caja
    profiles: ["caja-sur"]
    environment:
      CAJA: sur
      PORT: "9004"
    ports:
      - "${CAJA_SUR_PORT:-9004}:9004"

  caja-link:
    build: .
    env_file: .env
    ports:
      - "8083:8083"
    volumes:
      - ./caja-centro:/data/caja-centro:ro
      - ./config:/app/config:ro
    depends_on:
      - caja-norte
      - caja-oriente

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["test"]
    env_file: .env
    environment:
      SERVICE_BASE_URL: http://caja-link:8083
    volumes:
      - ./caja-centro:/data/caja-centro:ro
      - ./test-results:/app/test-results
    depends_on:
      - caja-link
      - caja-norte
      - caja-oriente
